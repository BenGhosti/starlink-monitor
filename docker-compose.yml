version: "3.9"

services:

  collector:
    build: ./collector
    container_name: starlink-collector
    restart: always
    environment:
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK:-}
      - STARLINK_HOST=${STARLINK_HOST:-192.168.100.1}
      - STARLINK_PORT=${STARLINK_PORT:-9200}
      - LOG_DISH_DEBUG=${LOG_DISH_DEBUG:-1}
      - DISCONNECT_CONFIRM_FAILURES=${DISCONNECT_CONFIRM_FAILURES:-8}
      - SPEEDTEST_MIN_DURATION_S=${SPEEDTEST_MIN_DURATION_S:-20}
      - SPEEDTEST_WARMUP_S=${SPEEDTEST_WARMUP_S:-3}
      - SPEEDTEST_LATENCY_PROBES=${SPEEDTEST_LATENCY_PROBES:-10}
      - MINUTELY_RETENTION_DAYS=${MINUTELY_RETENTION_DAYS:-730}
      - HOURLY_ROLLUP_DAYS=${HOURLY_ROLLUP_DAYS:-365}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    volumes:
      - /mnt/user/appdata/StarlinkMonitor/data:/data
    network_mode: host

  frontend:
    build: ./frontend
    container_name: starlink-frontend
    restart: always
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TOTP_SECRET=${TOTP_SECRET:-}
      - LAN_FALLBACK_PIN=${LAN_FALLBACK_PIN:-}
      - LAN_FALLBACK_CIDRS=${LAN_FALLBACK_CIDRS:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /mnt/user/appdata/StarlinkMonitor/data:/data:ro
    ports:
      - "8080:8080"
    depends_on:
      - collector
