<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign In · Dish Monitor</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/login.css?v=6">
</head>
<body>
  <div class="login-scene">
    <div class="login-orbit" aria-hidden="true">
      <svg viewBox="0 0 400 400" class="login-dish">
        <circle cx="200" cy="200" r="120" class="ring ring-1"></circle>
        <circle cx="200" cy="200" r="90"  class="ring ring-2"></circle>
        <circle cx="200" cy="200" r="60"  class="ring ring-3"></circle>
        <circle cx="200" cy="200" r="4"   class="hub"></circle>
      </svg>
    </div>

    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="login-brand">
        <span class="login-logo">Dish Monitor</span>
        <span class="login-sub">Dashboard Access</span>
      </div>

      <label class="login-field">
        <span>Username</span>
        <input type="text" id="loginUser" name="username" autocomplete="username" required autofocus>
      </label>

      <label class="login-field">
        <span>Password</span>
        <input type="password" id="loginPass" name="password" autocomplete="current-password" required>
      </label>

      <label class="login-field" id="loginTotpField">
        <span>2FA Code / LAN PIN (if enabled)</span>
        <input type="text" id="loginTotp" name="totp_code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="123456">
      </label>

      <button type="submit" class="login-submit" id="loginSubmit">Sign In</button>

      <div class="login-disclaimer">Private self-hosted tool. Not affiliated with SpaceX or Starlink.</div>

      <div class="login-error" id="loginError" style="display:none"></div>
    </form>

    <div class="login-footer">Dish Monitor by <a href="https://ben-ghosti.de" target="_blank" rel="noopener">Ben Ghosti</a> · unofficial</div>
  </div>

<script defer src="/static/login.js?v=5"></script>
</body>
</html>
